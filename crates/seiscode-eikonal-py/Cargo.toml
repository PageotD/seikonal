[package]
name = "seiscode-eikonal-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings for seiscode-eikonal"

[lib]
name = "seiscode_eikonal"
crate-type = ["cdylib", "rlib"]

[dependencies]
seiscode-eikonal-core = { path = "../seiscode-eikonal-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"