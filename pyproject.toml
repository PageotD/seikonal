[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "seikonal"
version = "0.1.0"
description = "Fast Marching Method eikonal solver in Rust with Python bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.maturin]
manifest-path = "crates/seikonal-py/Cargo.toml"
module-name = "seikonal"
features = ["pyo3/extension-module"]
