[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "seiscode-eikonal"
version = "0.2.0"
description = "Fast Marching Method eikonal solver and ray tracer in Rust with Python bindings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "D. Pageot" }
]
keywords = ["seismology", "geophysics", "eikonal", "fast-marching", "ray-tracing"]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/pageotd/seiscode-eikonal"
Repository = "https://github.com/pageotd/seiscode-eikonal"

[tool.maturin]
manifest-path = "crates/seiscode-eikonal-py/Cargo.toml"
module-name = "seiscode_eikonal"
features = ["pyo3/extension-module"]
